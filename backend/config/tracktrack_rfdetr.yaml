# TrackTrack (CVPR 2025) with appearance re-identification, fed by the football RF-DETR detector.
# The detector is confident on players (most boxes > 0.6), so new tracks can start lower than with the pose
# model while the low threshold still recovers partly occluded players in the second association stage.

tracker_type: tracktrack
track_high_thresh: 0.45
track_low_thresh: 0.1
new_track_thresh: 0.4
track_buffer: 120            # ~4.8 s at 25 fps: survive long occlusions in duels / set pieces
match_thresh: 0.75
lost_match_thr: 0.9          # relaxed rebind for still-lost tracks (long occlusions)
iou_weight: 0.5
reid_weight: 0.5
conf_weight: 0.1
angle_weight: 0.05
penalty_p: 0.2
penalty_q: 0.4
reduce_step: 0.05
tai_thr: 0.55
min_track_len: 3
gmc_method: sparseOptFlow
with_reid: True
model: yolo26s-reid.onnx
